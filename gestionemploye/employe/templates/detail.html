<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Détail de l'employé</title>
  <style>
    body { background:#f8f9fa; font-family:'Poppins',sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; }
    .card { background:#fff; border-radius:15px; box-shadow:0 8px 25px rgba(0,0,0,0.1); padding:30px; width:500px; }
    h2 { text-align:center; color:#6f42c1; margin-bottom:25px; }
    .info { margin-bottom:15px; }
    .info strong { color:#6f42c1; }
    .btn-back { display:block; text-align:center; background:#6f42c1; color:#fff; border-radius:30px; padding:10px; margin-top:20px; text-decoration:none; }
    .btn-back:hover { background:#5a32a3; transform:scale(1.05); }
  </style>
</head>
<body>
  <div class="card">
    <h2>Détail de l'employé</h2>
    <div class="info"><strong>Matricule :</strong> {{ employe.matricule }}</div>
    <div class="info"><strong>Date d'embauche :</strong> {{ employe.dateEmbauche }}</div>
    <div class="info"><strong>Poste :</strong> {{ employe.poste.titre }}</div>
    <div class="info"><strong>Département :</strong> {{ employe.departement.nom }}</div>
    <a href="{% url 'liste_employes' %}" class="btn-back">⬅ Retour à la liste</a>
  </div>
</body>
</html>
