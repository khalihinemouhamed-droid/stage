<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajouter un poste</title>
  <style>
    body {
      background:#f8f9fa;
      font-family:'Poppins',sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .form-container {
      background:#fff;
      border-radius:15px;
      box-shadow:0 8px 25px rgba(0,0,0,0.1);
      padding:30px;
      width:450px;
    }
    h2 {
      text-align:center;
      color:#6f42c1;
      margin-bottom:25px;
    }
    input, textarea, select {
      width:100%;
      padding:10px 15px;
      margin-bottom:15px;
      border-radius:30px;
      border:1px solid #ddd;
      font-size:14px;
    }
    button {
      width:100%;
      background:#6f42c1;
      color:#fff;
      border-radius:30px;
      padding:10px;
      border:none;
      cursor:pointer;
      font-size:15px;
      font-weight:500;
    }
    button:hover {
      background:#5a32a3;
      transform:scale(1.05);
    }
    .btn-back {
      display:block;
      text-align:center;
      background:#6c757d;
      color:#fff;
      border-radius:30px;
      padding:10px;
      margin-top:15px;
      text-decoration:none;
    }
    .btn-back:hover {
      background:#5a6268;
      transform:scale(1.05);
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Ajouter un poste</h2>
    <form method="post">
      {% csrf_token %}
      <input type="text" name="titre" placeholder="Titre du poste" required>
      <textarea name="description" placeholder="Description du poste" required></textarea>

      <!-- Sélecteur de département -->
      <select name="departement" required>
        <option value="">-- Choisir un département --</option>
        {% for d in departements %}
          <option value="{{ d.id }}">{{ d.nom }}</option>
        {% endfor %}
      </select>

      <button type="submit">➕ Ajouter</button>
    </form>
    <a href="{% url 'liste_postes' %}" class="btn-back">⬅ Retour à la liste</a>
  </div>
</body>
</html>
