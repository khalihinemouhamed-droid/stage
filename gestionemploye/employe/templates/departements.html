<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Liste des départements</title>
  <style>
    body { background:#f8f9fa; font-family:'Poppins',sans-serif; }
    .container { max-width:600px; margin:50px auto; background:#fff; padding:30px; border-radius:15px; box-shadow:0 8px 25px rgba(0,0,0,0.1); }
    h2 { text-align:center; color:#6f42c1; margin-bottom:25px; }
    ul { list-style:none; padding:0; }
    li { background:#f1f1f1; margin-bottom:10px; padding:10px 15px; border-radius:10px; display:flex; justify-content:space-between; align-items:center; }
    .actions { display:flex; gap:10px; }
    a { color:#6f42c1; text-decoration:none; }
    a:hover { text-decoration:underline; }
    .btn-add { display:block; text-align:center; background:#6f42c1; color:#fff; border-radius:30px; padding:10px; margin-top:20px; text-decoration:none; }
    .btn-add:hover { background:#5a32a3; transform:scale(1.05); }
  </style>
</head>
<body>
  <div class="container">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-success" style="margin-bottom:15px;">{{ message }}</div>
      {% endfor %}
    {% endif %}
    <h2>Liste des départements</h2>
    <ul>
      {% for d in departements %}
        <li>
          <span>{{ d.nom }} - {{ d.description }}</span>
          <div class="actions">
            <a href="{% url 'supprimer_departement' d.id %}">Supprimer</a>
          </div>
        </li>
      {% endfor %}
    </ul>
    <a href="{% url 'ajouter_departement' %}" class="btn-add">➕ Ajouter un département</a>
  </div>
</body>
</html>
