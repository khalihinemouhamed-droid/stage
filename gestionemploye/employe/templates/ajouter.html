<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajouter un employé</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .form-container {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      padding: 30px;
      width: 450px;
    }

    h2 {
      text-align: center;
      color: #6f42c1;
      font-weight: 600;
      margin-bottom: 25px;
    }

    input, select {
      width: 100%;
      padding: 10px 15px;
      margin-bottom: 15px;
      border-radius: 30px;
      border: 1px solid #ddd;
      transition: 0.3s;
    }

    input:focus, select:focus {
      border-color: #6f42c1;
      box-shadow: 0 0 10px rgba(111,66,193,0.3);
      outline: none;
    }

    button {
      width: 100%;
      background: #6f42c1;
      color: #fff;
      border-radius: 30px;
      padding: 10px;
      font-weight: 500;
      border: none;
      transition: 0.3s;
    }

    button:hover {
      background: #5a32a3;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Ajouter un employé</h2>
    <form method="post">
      {% csrf_token %}
      <input type="text" name="matricule" placeholder="Matricule" required>
      
      <input type="date" name="dateEmbauche" required>
      <select name="poste">
        <option value="">-- Poste --</option>
        {% for p in postes %}
          <option value="{{ p.id }}">{{ p.titre }}</option>
        {% endfor %}
      </select>
      <select name="departement">
        <option value="">-- Département --</option>
        {% for d in departements %}
          <option value="{{ d.id }}">{{ d.nom }}</option>
        {% endfor %}
      </select>
      <button type="submit">Ajouter</button>
    </form>
  </div>
</body>
</html>
