<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajouter un département</title>
  <style>
    body { background:#f8f9fa; font-family:'Poppins',sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; }
    .form-container { background:#fff; border-radius:15px; box-shadow:0 8px 25px rgba(0,0,0,0.1); padding:30px; width:450px; }
    h2 { text-align:center; color:#6f42c1; margin-bottom:25px; }
    input, textarea { width:100%; padding:10px 15px; margin-bottom:15px; border-radius:30px; border:1px solid #ddd; }
    button { width:100%; background:#6f42c1; color:#fff; border-radius:30px; padding:10px; border:none; cursor:pointer; }
    button:hover { background:#5a32a3; transform:scale(1.05); }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Ajouter un département</h2>
    <form method="post">
      {% csrf_token %}
      <input type="text" name="nom" placeholder="Nom du département" required>
      <textarea name="description" placeholder="Description" required></textarea>
      <button type="submit">Ajouter</button>
    </form>
  </div>
</body>
</html>
