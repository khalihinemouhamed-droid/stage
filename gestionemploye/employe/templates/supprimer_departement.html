<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Supprimer un département</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <div class="card p-4">
      <h2 class="mb-4">Supprimer le département</h2>
      <p>Êtes-vous sûr de vouloir supprimer le département <strong>{{ departement.nom }}</strong> ?</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Oui, supprimer</button>
        <a href="{% url 'liste_departements' %}" class="btn btn-secondary">Annuler</a>
      </form>
    </div>
  </div>
</body>
</html>
