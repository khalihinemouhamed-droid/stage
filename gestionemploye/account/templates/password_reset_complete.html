<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe modifié - Smart RH</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 font-sans antialiased p-4 relative overflow-hidden">

    <!-- Decorative background glow blur spots -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">
        
        <!-- Logo & Header Badge -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 text-white shadow-xl shadow-emerald-500/30 mb-4 transform hover:scale-105 transition-transform duration-300">
                <i class="fas fa-check text-2xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Smart <span class="text-indigo-400">RH</span></h1>
        </div>

        <!-- Success Card -->
        <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl shadow-indigo-950/50 p-8 border border-white/20 text-center">
            
            <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-emerald-100">
                <i class="fas fa-shield-check text-2xl"></i>
            </div>

            <h2 class="text-2xl font-bold text-slate-800 tracking-tight mb-2">Mot de passe mis à jour !</h2>
            <p class="text-xs text-slate-500 mb-8 leading-relaxed">
                Votre mot de passe a été modifié avec succès. Vous pouvez maintenant vous connecter à votre compte Smart RH avec vos nouveaux identifiants.
            </p>

            <a href="{% url 'login' %}" 
               class="w-full py-4 inline-flex items-center justify-center space-x-2 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 active:scale-[0.99] text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200">
                <i class="fas fa-sign-in-alt text-xs"></i>
                <span>Se connecter à mon compte</span>
            </a>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-slate-400 mt-6">
            &copy; 2026 Smart RH. Tous droits réservés.
        </p>

    </div>

</body>
</html>
