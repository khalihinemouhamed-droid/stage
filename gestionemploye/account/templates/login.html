<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - StaffCheck</title>
    <!-- Intégration de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Intégration de Font Awesome pour des icônes stylées (optionnel mais recommandé) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="relative min-h-screen flex items-center justify-center bg-cover bg-center bg-no-repeat font-sans" 
      style="background-image: url('https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1920&q=80');">

    <!-- OVERLAY (Assombrit l'image de fond) -->
    <div class="absolute inset-0 bg-black/40 z-10"></div>

    <!-- CARTE DE CONNEXION -->
    <div class="relative z-20 w-full max-w-md p-8 mx-4 bg-white/90 backdrop-blur-sm rounded-2xl shadow-2xl border border-white/20">
        
        <!-- Titre & Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex p-3 bg-violet-600 text-white rounded-xl mb-3 shadow-md shadow-violet-500/20">
                <i class="fas fa-user-lock text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 tracking-tight">Espace Connexion</h2>
            <p class="text-sm text-gray-500 mt-1">Accédez à votre tableau de bord StaffCheck</p>
        </div>

        <!-- GESTION DES MESSAGES D'ERREUR -->
        {% if messages %}
            <div class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 rounded-r-xl shadow-sm">
                <div class="flex items-center space-x-2 text-red-700 font-semibold text-sm mb-1">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>Erreur d'authentification</span>
                </div>
                {% for message in messages %}
                    {% if message.level_tag == 'error' %}
                        <p class="text-xs text-red-600 font-medium">{{ message }}</p>
                    {% endif %}
                {% endfor %}
            </div>
        {% endif %}

        <!-- FORMULAIRE -->
        <form method="post" class="space-y-5">
            {% csrf_token %}
            
            <!-- Identifiant -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Nom d'utilisateur</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                        <i class="far fa-user"></i>
                    </span>
                    <input type="text" name="username" required
                           class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-800 transition duration-300 focus:outline-none focus:border-violet-500 focus:bg-white focus:ring-4 focus:ring-violet-500/10" 
                           placeholder="Ex: m_ahmed">
                </div>
            </div>

            <!-- Mot de passe -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Mot de passe</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                        <i class="fas fa-key text-xs"></i>
                    </span>
                    <input type="password" name="password" required
                           class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium text-gray-800 transition duration-300 focus:outline-none focus:border-violet-500 focus:bg-white focus:ring-4 focus:ring-violet-500/10" 
                           placeholder="••••••••">
                </div>
            </div>

            <!-- Bouton Valider -->
            <button type="submit" 
                    class="w-full py-3 mt-4 bg-violet-600 hover:bg-violet-700 active:scale-[0.98] text-white font-bold text-sm rounded-xl shadow-lg shadow-violet-600/30 transition duration-300 transform">
                Se connecter <i class="fas fa-arrow-right ml-2 text-xs"></i>
            </button>
        </form>
        
    </div>

</body>
</html>
