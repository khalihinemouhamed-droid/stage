<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter une Présence - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-md border border-gray-200 p-8 w-full max-w-xl">
        
        <!-- En-tête -->
        <div class="flex items-center space-x-3 mb-6 border-b border-gray-100 pb-4">
            <div class="p-3 bg-indigo-100 text-indigo-700 rounded-xl">
                <i class="fas fa-calendar-plus text-xl"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-gray-800">Forcer / Ajouter une Présence</h2>
                <p class="text-sm text-gray-500">Enregistrer manuellement le pointage d'un membre du personnel.</p>
            </div>
        </div>

        <!-- Messages Flash Django -->
        {% if messages %}
            {% for message in messages %}
                <div class="p-4 mb-4 rounded-xl text-sm font-medium {% if message.tags == 'success' %}bg-green-50 text-green-800 border border-green-200{% else %}bg-red-50 text-red-800 border border-red-200{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Formulaire de saisie -->
        <form method="POST" action="" class="space-y-4">
            {% csrf_token %}

            <!-- Sélection de l'Employé -->
            <div>
                <label for="employe_id" class="block text-sm font-semibold text-gray-700 mb-1">Sélectionner l'Employé</label>
                <select name="employe_id" id="employe_id" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white text-gray-800">
                    <option value="">-- Choisir un employé --</option>
                    {% for emp in employes %}
                        <option value="{{ emp.id }}">{{ emp.matricule }} - {{ emp.utilisateur.first_name }} {{ emp.utilisateur.last_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Grille Date et Statut -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="date" class="block text-sm font-semibold text-gray-700 mb-1">Date</label>
                    <input type="date" name="date" id="date" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-gray-800">
                </div>
                <div>
                    <label for="statut" class="block text-sm font-semibold text-gray-700 mb-1">Statut</label>
                    <select name="statut" id="statut" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white text-gray-800">
                        <option value="PRESENT">Présent</option>
                        <option value="RETARD">En retard</option>
                        <option value="ABSENT">Absent</option>
                    </select>
                </div>
            </div>

            <!-- Grille Heures -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="heure_arrivee" class="block text-sm font-semibold text-gray-700 mb-1">Heure d'Arrivée (Optionnel)</label>
                    <input type="time" name="heure_arrivee" id="heure_arrivee" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-gray-800">
                </div>
                <div>
                    <label for="heure_depart" class="block text-sm font-semibold text-gray-700 mb-1">Heure de Départ (Optionnel)</label>
                    <input type="time" name="heure_depart" id="heure_depart" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-gray-800">
                </div>
            </div>

            <!-- Note / Motif -->
            <div>
                <label for="note" class="block text-sm font-semibold text-gray-700 mb-1">Note / Justification</label>
                <textarea name="note" id="note" rows="2" placeholder="Exemple : Oubli de pointage, Justifié par certificat..." class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-gray-800"></textarea>
            </div>

            <!-- Boutons d'actions -->
            <div class="flex space-x-3 pt-4 border-t border-gray-100">
                <button type="button" onclick="window.history.back();" class="w-1/2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 px-4 rounded-lg transition text-center">
                    Annuler
                </button>
                <button type="submit" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow transition flex items-center justify-center space-x-2">
                    <i class="fas fa-save"></i>
                    <span>Valider</span>
                </button>
            </div>
        </form>
    </div>

</body>
</html>
